
random_seed: 42
validation_fraction: 0.20

blocking:
  name_prefix_len: 5
  min_token_len: 3
  max_token_freq: 50
  max_block_size: 250
  max_candidates_per_s1: 80

candidate_compression:
  enabled: true
  max_candidates_per_s1: 80
  cheap_name_weight: 0.60
  cheap_address_weight: 0.40
  keep_if_cheap_score_at_least: 0.50

training:
  negatives_per_positive: 4
  singleton_negatives: 12
  min_training_candidates_per_s1: 4
  n_estimators: 600
  learning_rate: 0.05
  max_depth: 7
  min_child_weight: 3
  subsample: 0.85
  colsample_bytree: 0.90
  reg_lambda: 3.0
  reg_alpha: 0.1
  gamma: 0.0

thresholds:
  min_value: 0.30
  max_value: 0.99
  step: 0.01
